# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-runner
      # This deploy is what ships plugin changes to users, so the gates that used to happen at
      # publish time have to happen here. Typecheck carries the UI/sandbox wire contract guard
      # (src/shared/wireContract.ts) and must run before anything is deployed.
      - run: pnpm typecheck
      - run: pnpm web build
      # Order is load-bearing: the web build empties packages/web-app/dist and would wipe the
      # plugin UI if these two were swapped.
      - run: pnpm figma build:ui
      - run: pnpm smoke:plugin-ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-app-dist
          path: packages/web-app/dist
          retention-days: 1

  deploy: # Separate job so dependencies of the build never see the deploy secret
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-app-dist
          path: packages/web-app/dist
      - uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0.10.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HARMONIZER_WEB }}
          channelId: live
          projectId: harmonizer-web
